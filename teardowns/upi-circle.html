<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI Circle Teardown — Geetha Aripaka</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f7f7f5;
      --border: #e8e8e4;
      --text: #1a1a1a;
      --muted: #787774;
      --accent: #2f6feb;
      --accent-soft: #eef3fd;
      --radius: 8px;
      --max: 720px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .nav-logo {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text); }

    /* ── Content ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .coming-soon {
      text-align: center;
      max-width: 360px;
    }
    .coming-soon-icon {
      font-size: 40px;
      margin-bottom: 20px;
    }
    .coming-soon h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .coming-soon p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 24px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="/">Geetha Aripaka</a>
    <ul class="nav-links">
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/#teardowns">Teardowns</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="coming-soon">
    <div class="coming-soon-icon">💸</div>
    <h1>UPI Circle Teardown</h1>
    <p>This teardown is in progress. Check back soon.</p>
    <a class="back-link" href="/">← Back to portfolio</a>
  </div>
</main>

<footer>
  Built by Geetha Aripaka · 2026
</footer>

</body>
</html>
